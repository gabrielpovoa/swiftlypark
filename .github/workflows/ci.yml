name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitflow-policy:
    name: Git Flow policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) ;;
            *)
              echo "PRs para main devem partir de release/* ou hotfix/*." >&2
              exit 1
              ;;
          esac

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, zip
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run static checks
        run: bash tests/ci/run-static-analysis.sh

  unit-tests:
    name: Unit and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run test suite
        run: bash tests/ci/run-unit.sh

  integration-tests:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: parking_ci
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: parking_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      JOB_QUEUE_KEY: ci-job-queue-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client
      - name: Run integration suite
        run: bash tests/ci/run-integration.sh

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: swiftlypark:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
