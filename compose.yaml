services:
  # --------------------------------------------------------
  # APP (Apache + PHP + Composer)
  # --------------------------------------------------------
  app:
    build: .
    container_name: swiftlypark-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # Seed de assets existentes no workspace. O volume nomeado abaixo cobre
      # public/uploads; por isso os arquivos do host precisam de uma montagem
      # separada para serem copiados sem sobrescrever uploads já persistidos.
      - ./public/uploads:/var/www/seed-uploads:ro
      - swiftly-uploads:/var/www/html/public/uploads
    working_dir: /var/www/html

    # O bind mount acima preserva as permissões do host. O volume dedicado
    # é preparado para o usuário que executa o Apache antes da inicialização.
    command: >
      bash -c "install -d -o www-data -g www-data -m 0775 /var/www/html/public/uploads /var/www/html/public/uploads/companies
      && cp -an /var/www/seed-uploads/. /var/www/html/public/uploads/
      && chown -R www-data:www-data /var/www/html/public/uploads
      && chmod -R u+rwX,g+rwX /var/www/html/public/uploads
      && composer install
      && apache2-foreground"

    environment:
      - DB_HOST=db
      - DB_DATABASE=parking
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JOB_QUEUE_KEY=${JOB_QUEUE_KEY:-swiftlypark-local-job-queue-key-change-in-production}

    networks:
      - swiftly-network
    depends_on:
      - db

  # --------------------------------------------------------
  # BANCO DE DADOS (MySQL 8)
  # --------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: swiftlypark-db
    restart: always

    environment:
      MYSQL_DATABASE: parking
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"

    ports:
      - "3306:3306"

    volumes:
      - swiftly-db-data:/var/lib/mysql

    networks:
      - swiftly-network

  # --------------------------------------------------------
  # PHPMYADMIN
  # --------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: swiftlypark-pma
    restart: always
    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

    networks:
      - swiftly-network
    depends_on:
      - db

# --------------------------------------------------------
# NETWORK
# --------------------------------------------------------
networks:
  swiftly-network:
    driver: bridge

# --------------------------------------------------------
# VOLUME (persistência do MySQL)
# --------------------------------------------------------
volumes:
  swiftly-db-data:
  swiftly-uploads:
